<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Damp Neuro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #000000; --bg2: #0a0a0a; --bg3: #121212; --bg4: #1a1a1a;
    --border: #1f1f1f; --accent: #00ff88; --accent2: #00cc6a;
    --text: #ffffff; --text2: #a0a0a0; --text3: #505050;
    --user-bg: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
    --shadow: rgba(0, 255, 136, 0.1);
  }
  html, body { height: 100%; background: var(--bg); font-family: 'Inter', sans-serif; color: var(--text); overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; position: relative; }
  body::before { content: ''; position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 800px; height: 800px; background: radial-gradient(circle, rgba(0,255,136,0.05) 0%, transparent 70%); pointer-events: none; z-index: 0; filter: blur(40px); }
  body::after { content: ''; position: fixed; bottom: 0; right: 0; width: 600px; height: 600px; background: radial-gradient(circle, rgba(0,255,136,0.03) 0%, transparent 70%); pointer-events: none; z-index: 0; filter: blur(40px); }

  /* OVERLAY */
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 100; display: flex; align-items: center; justify-content: center; }
  #overlay.hidden { display: none; }
  .modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 40px 32px; width: 400px; display: flex; flex-direction: column; gap: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 1px rgba(0,255,136,0.2); }
  .modal-logo { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
  .modal-logo .ai-avatar { width: 50px; height: 50px; border-radius: 12px; background: var(--user-bg); display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 0 30px var(--shadow); }
  .modal-logo-text { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .modal-sub { font-size: 13px; color: var(--text2); font-weight: 500; }
  .modal label { font-size: 12px; color: var(--text2); margin-bottom: 8px; display: block; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .modal input { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; font-size: 14px; font-family: 'Inter', sans-serif; color: var(--text); outline: none; transition: all .2s; }
  .modal input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--shadow); }
  .modal input::placeholder { color: var(--text3); }
  .modal-btn { width: 100%; padding: 13px; border: none; border-radius: 8px; background: var(--user-bg); color: #000; font-size: 14px; font-weight: 700; font-family: 'Inter', sans-serif; cursor: pointer; transition: all .2s; box-shadow: 0 4px 20px var(--shadow); }
  .modal-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 25px var(--shadow); }
  .modal-btn:active { transform: translateY(0); }
  .modal-err { font-size: 12px; color: #ff4444; min-height: 18px; font-weight: 500; }
  .modal-tabs { display: flex; gap: 8px; background: transparent; border-radius: 8px; padding: 0; }
  .tab-btn { flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: var(--text2); font-size: 13px; font-family: 'Inter', sans-serif; font-weight: 600; cursor: pointer; transition: all .2s; }
  .tab-btn.active { background: var(--bg3); color: var(--accent); border-color: var(--accent); }

  /* PROFILE MODAL */
  #profileModal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: flex; align-items: center; justify-content: center; }
  #profileModal.hidden { display: none; }
  .profile-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 20px; padding: 28px; width: 340px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 24px 80px rgba(0,0,0,0.7); }
  .profile-header { display: flex; align-items: center; gap: 14px; }
  .profile-ava { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, #6C63FF 0%, #a89cff 100%); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: #fff; flex-shrink: 0; }
  .profile-name { font-size: 17px; font-weight: 600; }
  .profile-username { font-size: 13px; color: var(--accent2); margin-top: 2px; }
  .profile-divider { height: 1px; background: var(--border); }
  .profile-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  .profile-row span:first-child { color: var(--text2); }
  .profile-row span:last-child { color: var(--text); font-weight: 500; font-family: monospace; font-size: 12px; background: var(--bg3); padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border); }
  .profile-close { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 10px; background: transparent; color: var(--text2); font-size: 13px; font-family: 'Outfit', sans-serif; cursor: pointer; transition: background .15s, color .15s; }
  .profile-close:hover { background: var(--bg3); color: var(--text); }
  .profile-logout { width: 100%; padding: 10px; border: 1px solid rgba(255,80,80,0.25); border-radius: 10px; background: transparent; color: #ff6b6b; font-size: 13px; font-family: 'Outfit', sans-serif; cursor: pointer; transition: background .15s; }
  .profile-logout:hover { background: rgba(255,80,80,0.08); }

  /* SETTINGS MODAL */
  #settingsModal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: flex; align-items: center; justify-content: center; }
  #settingsModal.hidden { display: none; }
  .settings-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 20px; padding: 28px; width: 360px; max-height: 85vh; overflow-y: auto; display: flex; flex-direction: column; gap: 22px; box-shadow: 0 24px 80px rgba(0,0,0,0.7); }
  .settings-title { font-size: 16px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 10px; }
  .settings-title svg { opacity: 0.7; }
  .settings-section { display: flex; flex-direction: column; gap: 10px; }
  .settings-label { font-size: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.6px; font-weight: 500; }
  .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .settings-row span { font-size: 13px; color: var(--text2); }
  /* Temperature slider */
  .temp-track { flex: 1; display: flex; align-items: center; gap: 10px; }
  .temp-track input[type=range] { flex: 1; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 4px; background: var(--bg4); outline: none; cursor: pointer; }
  .temp-track input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); cursor: pointer; border: 2px solid var(--bg2); }
  .temp-track input[type=number] { width: 60px; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; font-size: 13px; font-family: 'Outfit', sans-serif; color: var(--text); outline: none; text-align: center; }
  .temp-track input[type=number]::-webkit-inner-spin-button,
  .temp-track input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .temp-track input[type=number] { -moz-appearance: textfield; }
  .temp-val { font-size: 13px; color: var(--accent2); font-weight: 600; min-width: 32px; text-align: right; }
  /* Mode selector */
  .mode-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .mode-label { font-size: 13px; color: var(--text2); }
  .mode-select-wrap { position: relative; }
  .mode-select { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'Outfit', sans-serif; font-size: 13px; padding: 6px 28px 6px 12px; outline: none; cursor: pointer; appearance: none; -webkit-appearance: none; transition: border-color .2s; }
  .mode-select:focus { border-color: rgba(108,99,255,0.6); }
  .mode-arrow { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--text2); font-size: 10px; }
  /* Custom word inputs */
  .custom-words { display: flex; gap: 10px; margin-top: 4px; }
  .custom-words input { flex: 1; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font-size: 13px; font-family: 'Outfit', sans-serif; color: var(--text); outline: none; transition: border-color .2s; }
  .custom-words input:focus { border-color: rgba(108,99,255,0.6); }
  .custom-words input::placeholder { color: var(--text3); }
  .custom-words input[type=number]::-webkit-inner-spin-button,
  .custom-words input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .custom-words input[type=number] { -moz-appearance: textfield; }
  /* File upload */
  .file-upload-wrap { display: flex; flex-direction: column; gap: 8px; }
  .file-upload-btn { position: relative; overflow: hidden; display: inline-block; width: 100%; }
  .file-upload-btn input[type=file] { position: absolute; left: -9999px; }
  .file-upload-label { display: block; padding: 10px 14px; background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; color: var(--text2); font-size: 13px; text-align: center; cursor: pointer; transition: background .15s, border-color .15s; }
  .file-upload-label:hover { background: var(--bg4); border-color: rgba(108,99,255,0.4); }
  .file-name { font-size: 12px; color: var(--text3); text-align: center; min-height: 16px; }
  .api-key-input { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; font-size: 13px; font-family: 'Outfit', sans-serif; color: var(--text); outline: none; transition: border-color .2s; }
  .api-key-input:focus { border-color: rgba(108,99,255,0.6); }
  .api-key-input::placeholder { color: var(--text3); }
  .settings-save { width: 100%; padding: 10px; border: none; border-radius: 10px; background: linear-gradient(135deg, #6C63FF, #9D97FF); color: #fff; font-size: 13px; font-weight: 600; font-family: 'Outfit', sans-serif; cursor: pointer; transition: opacity .15s; }
  .settings-save:hover { opacity: 0.9; }
  .settings-close { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 10px; background: transparent; color: var(--text2); font-size: 13px; font-family: 'Outfit', sans-serif; cursor: pointer; transition: background .15s, color .15s; }
  .settings-close:hover { background: var(--bg3); color: var(--text); }

  /* CHAT */
  #chat { width: 500px; height: 720px; background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 1px rgba(0,255,136,0.2); position: relative; z-index: 1; }
  #header { display: flex; align-items: center; gap: 12px; padding: 18px 20px; background: var(--bg2); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .ai-avatar { width: 42px; height: 42px; border-radius: 10px; background: var(--user-bg); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; box-shadow: 0 0 20px var(--shadow); }
  #htext { flex: 1; }
  #hname { font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
  #hsub { font-size: 12px; color: var(--text2); margin-top: 2px; font-weight: 600; }
  .header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .user-btn { width: 38px; height: 38px; border-radius: 10px; background: var(--bg3); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; font-weight: 700; color: var(--accent); transition: all .2s; }
  .user-btn:hover { background: var(--bg4); transform: scale(1.05); border-color: var(--accent); }
  .gear-btn { width: 36px; height: 36px; border-radius: 10px; background: transparent; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .2s; }
  .gear-btn:hover { background: var(--bg3); transform: rotate(90deg); }
  .gear-btn svg { transition: transform .3s ease; stroke: var(--text2); }
  #msgs { flex: 1; overflow-y: auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
  #msgs::-webkit-scrollbar { width: 4px; }
  #msgs::-webkit-scrollbar-track { background: transparent; }
  #msgs::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 4px; }
  .day-sep { text-align: center; font-size: 11px; color: var(--text3); display: flex; align-items: center; gap: 12px; margin: 8px 0; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .day-sep::before, .day-sep::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .row { display: flex; gap: 12px; animation: pop 0.25s cubic-bezier(.34,1.4,.64,1); }
  @keyframes pop { from { opacity: 0; transform: translateY(12px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .row.user { flex-direction: row-reverse; }
  .ava { width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; margin-top: 2px; }
  .ava.ai { background: var(--user-bg); color: #000; box-shadow: 0 0 15px var(--shadow); }
  .ava.user { background: var(--bg3); color: var(--accent); border: 1px solid var(--border); }
  .col { display: flex; flex-direction: column; max-width: 72%; }
  .row.user .col { align-items: flex-end; }
  .bubble { padding: 12px 16px; font-size: 14px; line-height: 1.6; word-break: break-word; font-weight: 500; }
  .row.ai .bubble { background: var(--bg3); color: var(--text); border: 1px solid var(--border); border-radius: 4px 16px 16px 16px; }
  .row.user .bubble { background: var(--user-bg); color: #000; border: none; border-radius: 16px 4px 16px 16px; box-shadow: 0 4px 20px var(--shadow); font-weight: 600; }
  .ts { font-size: 11px; color: var(--text3); margin-top: 6px; padding: 0 4px; font-weight: 600; }
  .typing-row { display: flex; gap: 12px; }
  .typing-bubble { background: var(--bg3); border: 1px solid var(--border); border-radius: 4px 16px 16px 16px; padding: 14px 18px; display: flex; align-items: center; gap: 6px; }
  .typing-bubble span { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: bounce 1.3s infinite; }
  .typing-bubble span:nth-child(2) { animation-delay: .2s; }
  .typing-bubble span:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: .3; } 30% { transform: translateY(-6px); opacity: 1; } }
  #foot { padding: 16px 18px; background: var(--bg2); border-top: 1px solid var(--border); display: flex; align-items: flex-end; gap: 12px; flex-shrink: 0; }
  #inp { flex: 1; background: var(--bg3); border: 1px solid var(--border); border-radius: 12px; padding: 12px 18px; font-size: 14px; font-family: 'Inter', sans-serif; color: var(--text); outline: none; resize: none; max-height: 120px; line-height: 1.5; transition: all .2s; font-weight: 500; }
  #inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--shadow); }
  #inp::placeholder { color: var(--text3); }
  #sbtn { width: 44px; height: 44px; border-radius: 12px; border: none; background: var(--user-bg); color: #000; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .2s; box-shadow: 0 4px 20px var(--shadow); font-weight: 900; }
  #sbtn:hover { transform: translateY(-2px); box-shadow: 0 6px 25px var(--shadow); }
  #sbtn:active { transform: translateY(0); }
  #sbtn:disabled { opacity: 0.3; cursor: default; transform: none; }
</style>
</head>
<body>

<!-- AUTH OVERLAY -->
<div id="overlay">
  <div class="modal">
    <div class="modal-logo">
      <div class="ai-avatar">✦</div>
      <div>
        <div class="modal-logo-text">Damp Neuro</div>
        <div class="modal-sub">никита ебар TEST</div>
      </div>
    </div>
    <div class="modal-tabs">
      <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Войти</button>
      <button class="tab-btn" id="tab-reg" onclick="switchTab('reg')">Регистрация</button>
    </div>
    <div id="form-login">
      <div style="display:flex;flex-direction:column;gap:12px;">
        <div><label>Имя пользователя</label><input id="l-user" type="text" placeholder="username" autocomplete="username"></div>
        <div><label>Пароль</label><input id="l-pass" type="password" placeholder="••••••••" autocomplete="current-password"></div>
        <div class="modal-err" id="l-err"></div>
        <button class="modal-btn" onclick="doLogin()">Войти</button>
      </div>
    </div>
    <div id="form-reg" style="display:none;">
      <div style="display:flex;flex-direction:column;gap:12px;">
        <div><label>Имя</label><input id="r-name" type="text" placeholder="Как тебя зовут?"></div>
        <div><label>Имя пользователя</label><input id="r-user" type="text" placeholder="username (без пробелов)"></div>
        <div><label>Пароль</label><input id="r-pass" type="password" placeholder="••••••••"></div>
        <div><label>Инвайт код</label><input id="r-invite" type="text" placeholder="INVITE-XXXXXXXX"></div>
        <div class="modal-err" id="r-err"></div>
        <button class="modal-btn" onclick="doRegister()">Создать аккаунт</button>
      </div>
    </div>
  </div>
</div>

<!-- PROFILE MODAL -->
<div id="profileModal" class="hidden">
  <div class="profile-card">
    <div class="profile-header">
      <div class="profile-ava" id="pAva">?</div>
      <div>
        <div class="profile-name" id="pName">—</div>
        <div class="profile-username" id="pUsername">—</div>
      </div>
    </div>
    <div class="profile-divider"></div>
    <div class="profile-row"><span>ID пользователя</span><span id="pId">—</span></div>
    <div class="profile-row"><span>Дата регистрации</span><span id="pDate" style="font-family:'Outfit',sans-serif;font-size:13px;background:none;border:none;padding:0;">—</span></div>
    <div class="profile-row"><span>Статус аккаунта</span><span id="pStatus">—</span></div>
    <div class="profile-row"><span>Подписка</span><span id="pSubscription">—</span></div>
    <div class="profile-divider"></div>
    <div id="adminSection" style="display:none;flex-direction:column;">
      <div class="profile-divider"></div>
      <div style="font-size:12px;color:var(--accent2);font-weight:600;margin-bottom:8px;">АДМИН</div>
      <button class="modal-btn" onclick="openAdminPanel()" style="width:100%;">🛠 Открыть админ панель</button>
    </div>
    <button class="profile-close" onclick="closeProfile()">Закрыть</button>
    <button class="profile-logout" onclick="doLogout()">Выйти из аккаунта</button>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div id="settingsModal" class="hidden">
  <div class="settings-card">
    <div class="settings-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      Настройки генерации
    </div>

    <div class="settings-section">
      <div class="settings-label">Температура</div>
      <div class="settings-row">
        <span>Случайность</span>
        <div class="temp-track">
          <input type="range" id="tempSlider" min="0.01" max="2" step="0.01" value="1">
          <input type="number" id="tempInput" min="0.01" max="2" step="0.01" value="1.00">
        </div>
      </div>
    </div>

    <div class="settings-section">
      <div class="mode-row">
        <span class="mode-label">Mode:</span>
        <div class="mode-select-wrap">
          <select class="mode-select" id="modeSelect" onchange="onModeChange()">
            <option value="default" title="Генерирует от 200 до 500 слов">Default</option>
            <option value="short" title="Генерирует от 50 до 150 слов">Short</option>
            <option value="long" title="Генерирует от 500 до 1500 слов">Long</option>
            <option value="custom" title="Генерирует кастомное кол-во слов">Custom</option>
          </select>
          <span class="mode-arrow">▾</span>
        </div>
      </div>
      <div id="modeHint" style="font-size:12px;color:var(--text3);margin-top:2px;">Генерирует от 200 до 500 слов</div>
      <div class="custom-words" id="customWords" style="display:none;">
        <input type="number" id="minWords" placeholder="Мин. слов" min="1" max="5000">
        <input type="number" id="maxWords" placeholder="Макс. слов" min="1" max="5000">
      </div>
    </div>

    <button class="settings-save" onclick="saveSettings()">Сохранить</button>
    <button class="settings-close" onclick="closeSettings()">Закрыть</button>
  </div>
</div>

<!-- CHAT -->

<script>
  const API_URL = window.location.origin + '/api';
  const SESSION_KEY = 'damp_neuro_session';
  const SETTINGS_KEY = 'damp_neuro_settings';

  function getSession() { try { return JSON.parse(localStorage.getItem(SESSION_KEY)); } catch { return null; } }
  function setSession(u) { localStorage.setItem(SESSION_KEY, JSON.stringify(u)); }
  function clearSession() { localStorage.removeItem(SESSION_KEY); }
  function loadSettings() { try { return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || { temp: 1.0, mode: 'default', minW: 200, maxW: 500 }; } catch { return { temp: 1.0, mode: 'default', minW: 200, maxW: 500 }; } }
  function saveSettingsData(s) { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }

  function switchTab(t) {
    document.getElementById('form-login').style.display = t === 'login' ? '' : 'none';
    document.getElementById('form-reg').style.display = t === 'reg' ? '' : 'none';
    document.getElementById('tab-login').classList.toggle('active', t === 'login');
    document.getElementById('tab-reg').classList.toggle('active', t === 'reg');
  }

  async function doRegister() {
    const name = document.getElementById('r-name').value.trim();
    const username = document.getElementById('r-user').value.trim().toLowerCase().replace(/\s+/g,'');
    const password = document.getElementById('r-pass').value;
    const inviteCode = document.getElementById('r-invite').value.trim();
    const err = document.getElementById('r-err');
    
    if (!name || !username || !password || !inviteCode) { 
      err.textContent = 'Заполни все поля'; 
      return; 
    }
    
    err.textContent = 'Регистрация...';
    
    // Собираем информацию об устройстве
    const deviceInfo = await collectDeviceInfo();
    
    try {
      const response = await fetch(`${API_URL}/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, username, password, inviteCode, deviceInfo })
      });
      
      const data = await response.json();
      
      if (!response.ok) {
        err.textContent = data.error || 'Ошибка регистрации';
        return;
      }
      
      err.textContent = '';
      loginUser(data);
    } catch (error) {
      err.textContent = 'Ошибка соединения с сервером';
      console.error('Ошибка регистрации:', error);
    }
  }

  async function doLogin() {
    const username = document.getElementById('l-user').value.trim().toLowerCase();
    const password = document.getElementById('l-pass').value;
    const err = document.getElementById('l-err');
    
    if (!username || !password) { 
      err.textContent = 'Заполни все поля'; 
      return; 
    }
    
    err.textContent = 'Вход...';
    
    // Собираем информацию об устройстве
    const deviceInfo = await collectDeviceInfo();
    
    try {
      const response = await fetch(`${API_URL}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password, deviceInfo })
      });
      
      const data = await response.json();
      
      if (!response.ok) {
        err.textContent = data.error || 'Ошибка входа';
        return;
      }
      
      err.textContent = '';
      loginUser(data);
    } catch (error) {
      err.textContent = 'Ошибка соединения с сервером';
      console.error('Ошибка входа:', error);
    }
  }

  // Сбор информации об устройстве
  async function collectDeviceInfo() {
    const info = {
      screenResolution: `${screen.width}x${screen.height}`,
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
      platform: navigator.platform,
      language: navigator.language,
      deviceMemory: navigator.deviceMemory || 'Unknown',
      hardwareConcurrency: navigator.hardwareConcurrency || 'Unknown',
      connectionType: navigator.connection ? navigator.connection.effectiveType : 'Unknown'
    };

    // Попытка получить информацию о батарее
    if ('getBattery' in navigator) {
      try {
        const battery = await navigator.getBattery();
        info.batteryLevel = Math.round(battery.level * 100);
        info.batteryCharging = battery.charging;
      } catch (e) {
        info.batteryLevel = null;
        info.batteryCharging = false;
      }
    } else {
      info.batteryLevel = null;
      info.batteryCharging = false;
    }

    return info;
  }

  function loginUser(user) {
    setSession(user);
    document.getElementById('overlay').classList.add('hidden');
    initChat(user);
  }

  function doLogout() { clearSession(); location.reload(); }

  // --- FILE UPLOAD ---
  async function handleFileUpload(input) {
    const file = input.files[0];
    if (!file) return;
    
    if (!file.name.endsWith('.txt')) {
      alert('Можно загружать только .txt файлы');
      input.value = '';
      return;
    }

    document.getElementById('fileName').textContent = 'Загрузка...';

    const formData = new FormData();
    formData.append('file', file);

    try {
      const response = await fetch(`${API_URL}/upload-training`, {
        method: 'POST',
        body: formData
      });

      const data = await response.json();

      if (response.ok) {
        document.getElementById('fileName').textContent = file.name;
      } else {
        document.getElementById('fileName').textContent = 'Ошибка загрузки';
        alert(data.error || 'Ошибка загрузки файла');
      }
    } catch (error) {
      document.getElementById('fileName').textContent = 'Ошибка загрузки';
      console.error('Ошибка загрузки:', error);
    }
  }

  // --- SETTINGS ---
  const modeHints = {
    default: 'Генерирует от 200 до 500 слов',
    short: 'Генерирует от 50 до 150 слов',
    long: 'Генерирует от 500 до 1500 слов',
    custom: 'Генерирует кастомное кол-во слов'
  };

  function onModeChange() {
    const mode = document.getElementById('modeSelect').value;
    document.getElementById('modeHint').textContent = modeHints[mode] || '';
    document.getElementById('customWords').style.display = mode === 'custom' ? 'flex' : 'none';
  }

  function openSettings() {
    const s = loadSettings();
    document.getElementById('tempSlider').value = s.temp;
    document.getElementById('tempInput').value = parseFloat(s.temp).toFixed(2);
    document.getElementById('modeSelect').value = s.mode;
    document.getElementById('modeHint').textContent = modeHints[s.mode] || '';
    document.getElementById('customWords').style.display = s.mode === 'custom' ? 'flex' : 'none';
    if (s.mode === 'custom') {
      document.getElementById('minWords').value = s.minW || '';
      document.getElementById('maxWords').value = s.maxW || '';
    }
    document.getElementById('settingsModal').classList.remove('hidden');
  }

  function closeSettings() { document.getElementById('settingsModal').classList.add('hidden'); }

  function saveSettings() {
    const temp = parseFloat(document.getElementById('tempInput').value);
    const mode = document.getElementById('modeSelect').value;
    
    let minW = 200, maxW = 500;
    if (mode === 'custom') {
      minW = parseInt(document.getElementById('minWords').value) || 1;
      maxW = parseInt(document.getElementById('maxWords').value) || 500;
      if (minW < 1) minW = 1;
      if (maxW > 5000) maxW = 5000;
      if (minW > maxW) { alert('Минимум не может быть больше максимума'); return; }
    } else if (mode === 'short') { minW = 50; maxW = 150; }
    else if (mode === 'long') { minW = 500; maxW = 1500; }
    
    saveSettingsData({ temp, mode, minW, maxW });
    closeSettings();
  }

  // Синхронизация слайдера и поля ввода температуры
  document.getElementById('tempSlider').addEventListener('input', function() {
    const val = parseFloat(this.value).toFixed(2);
    document.getElementById('tempInput').value = val;
  });

  document.getElementById('tempInput').addEventListener('input', function() {
    let val = parseFloat(this.value);
    if (val < 0.01) val = 0.01;
    if (val > 2) val = 2;
    this.value = val.toFixed(2);
    document.getElementById('tempSlider').value = val;
  });

  // --- PROFILE ---
  function openProfile() {
    const user = getSession(); if (!user) return;
    document.getElementById('pAva').textContent = user.name.charAt(0).toUpperCase();
    document.getElementById('pName').textContent = user.name;
    document.getElementById('pUsername').textContent = '@' + user.username;
    document.getElementById('pId').textContent = user.id;
    document.getElementById('pDate').textContent = user.created || '—';
    
    // Статус аккаунта
    const statusEl = document.getElementById('pStatus');
    if (user.isBanned) {
      statusEl.innerHTML = '<span style="color:#ff6b6b;font-weight:600;">BANNED</span>';
    } else {
      statusEl.innerHTML = '<span style="color:#51cf66;">Активен</span>';
    }
    
    // Подписка
    const subEl = document.getElementById('pSubscription');
    if (user.subscriptionUntil && new Date(user.subscriptionUntil) > new Date()) {
      const date = new Date(user.subscriptionUntil);
      subEl.innerHTML = `<span style="color:#ffd700;font-weight:600;">Да (до ${date.toLocaleDateString('ru')})</span>`;
    } else {
      subEl.innerHTML = '<span style="color:#ff6b6b;">Нет</span>';
    }
    
    // Показываем админ секцию если пользователь - админ
    if (user.isAdmin) {
      document.getElementById('adminSection').style.display = 'flex';
    } else {
      document.getElementById('adminSection').style.display = 'none';
    }
    
    document.getElementById('profileModal').classList.remove('hidden');
  }
  
  function openAdminPanel() {
    const user = getSession();
    if (!user || !user.isAdmin) return;
    window.location.href = '/admin';
  }
  function closeProfile() { document.getElementById('profileModal').classList.add('hidden'); }

  // --- CHAT ---
  function initChat(user) {
    const initials = user.name.charAt(0).toUpperCase();
    document.getElementById('userBtn').textContent = initials;

    const msgs = document.getElementById('msgs');
    const inp = document.getElementById('inp');
    const sbtn = document.getElementById('sbtn');

    // Проверка подписки (админы могут всё)
    const hasSubscription = user.isAdmin || (user.subscriptionUntil && new Date(user.subscriptionUntil) > new Date());
    
    if (!hasSubscription) {
      // Блокируем чат если нет подписки
      inp.disabled = true;
      inp.placeholder = '🔒 ПРИОБРЕТИТЕ ПОДПИСКУ ДЛЯ ДОСТУПА К ЧАТУ';
      sbtn.disabled = true;
      sbtn.style.opacity = '0.3';
      
      // Показываем сообщение
      const noSubMsg = document.createElement('div');
      noSubMsg.style.cssText = 'text-align:center; padding:40px 20px; color:var(--text2);';
      noSubMsg.innerHTML = `
        <div style="font-size:48px; margin-bottom:16px;">🔒</div>
        <div style="font-size:18px; font-weight:600; color:var(--text); margin-bottom:8px;">Требуется подписка</div>
        <div style="font-size:14px;">Для доступа к чату необходимо приобрести подписку</div>
        <div style="font-size:13px; color:var(--text3); margin-top:12px;">Обратитесь к администратору</div>
      `;
      msgs.appendChild(noSubMsg);
      return; // Останавливаем инициализацию чата
    }

    const replies = [
      "Понял вас! Обрабатываю запрос...",
      "Интересный вопрос. Давайте разберём это подробно.",
      "Хороший запрос. Вот что думаю по этому поводу:",
      "Есть несколько вариантов. Хотите рассмотреть все?",
      "Конечно! Могу помочь с этим.",
      "Отлично. Вот мои мысли по теме:",
      "Понятно. Могу предложить несколько идей.",
    ];
    let ri = 0;

    function t() { return new Date().toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' }); }

    function addSep(text) {
      const d = document.createElement('div');
      d.className = 'day-sep'; d.textContent = text; msgs.appendChild(d);
    }

    function addMsg(text, who) {
      const row = document.createElement('div'); row.className = 'row ' + who;
      const ava = document.createElement('div'); ava.className = 'ava ' + who;
      ava.textContent = who === 'ai' ? '✦' : initials;
      const col = document.createElement('div'); col.className = 'col';
      const b = document.createElement('div'); b.className = 'bubble'; b.textContent = text;
      const ts = document.createElement('div'); ts.className = 'ts'; ts.textContent = t();
      col.appendChild(b); col.appendChild(ts);
      row.appendChild(ava); row.appendChild(col);
      msgs.appendChild(row); msgs.scrollTop = msgs.scrollHeight;
    }

    function showTyping() {
      const row = document.createElement('div'); row.className = 'typing-row'; row.id = 'typing';
      const ava = document.createElement('div'); ava.className = 'ava ai'; ava.textContent = '✦';
      const b = document.createElement('div'); b.className = 'typing-bubble';
      b.innerHTML = '<span></span><span></span><span></span>';
      row.appendChild(ava); row.appendChild(b); msgs.appendChild(row); msgs.scrollTop = msgs.scrollHeight;
    }

    function hideTyping() { const el = document.getElementById('typing'); if (el) el.remove(); }

    function send() {
      const text = inp.value.trim();
      if (!text || sbtn.disabled) return;
      
      addMsg(text, 'user'); 
      inp.value = ''; 
      inp.style.height = 'auto'; 
      sbtn.disabled = true;
      showTyping();
      
      const s = loadSettings();
      
      fetch(`${API_URL}/generate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          prompt: text,
          temperature: s.temp,
          mode: s.mode,
          minWords: s.minW,
          maxWords: s.maxW
        })
      })
      .then(res => res.json())
      .then(data => {
        hideTyping();
        if (data.error) {
          addMsg('Ошибка: ' + data.error, 'ai');
        } else {
          addMsg(data.text, 'ai');
        }
        sbtn.disabled = false; 
        inp.focus();
      })
      .catch(error => {
        hideTyping();
        addMsg('Ошибка соединения с сервером', 'ai');
        sbtn.disabled = false;
        inp.focus();
        console.error('Ошибка:', error);
      });
    }

    sbtn.addEventListener('click', send);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
    inp.addEventListener('input', () => { inp.style.height = 'auto'; inp.style.height = Math.min(inp.scrollHeight, 120) + 'px'; });

    addSep('сегодня');
    setTimeout(() => addMsg('Привет, ' + user.name + '! Вводи свою задачу для меня и в настройках настрой параметры генерации', 'ai'), 400);
  }

  // BOOT
  const sess = getSession();
  if (sess) {
    document.getElementById('overlay').classList.add('hidden');
    initChat(sess);
  }

  

  
</script>

async function toggleBan() {
  if (!currentUser) return;
  
  const admin = getSession();
  if (!admin || !admin.isAdmin) return;
  
  const newBanStatus = !currentUser.isBanned;
  
  try {
    const response = await fetch(`${API_URL}/admin/ban`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        adminId: admin.id, 
        userId: currentUser.id, 
        banned: newBanStatus 
      })
    });
    
    if (response.ok) {
      currentUser.isBanned = newBanStatus;
      
      
      alert(newBanStatus ? 'Пользователь забанен' : 'Пользователь разбанен');
    } else {
      alert('Ошибка обновления');
    }
  } catch (error) {
    alert('Ошибка соединения с сервером');
  }
}

async function giveSubscription() {
  if (!currentUser) return;
  
  const days = parseInt(document.getElementById('subDays').value);
  if (!days || days < 1) {
    alert('Укажи количество дней (от 1 до 365)');
    return;
  }
  
  const admin = getSession();
  if (!admin || !admin.isAdmin) return;
  
  try {
    const response = await fetch(`${API_URL}/admin/subscription`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        adminId: admin.id, 
        userId: currentUser.id, 
        days: days 
      })
    });
    
    const data = await response.json();
    
    if (response.ok) {
      alert(`Подписка выдана на ${days} дней`);
      document.getElementById('subDays').value = '';
      
      
    } else {
      alert('Ошибка выдачи подписки');
    }
